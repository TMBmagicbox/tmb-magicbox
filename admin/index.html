async function loadAvatars(){const paths=[...C.map(c=>c.avatar_path),SET.my_avatar].filter(Boolean);if(!paths.length||DEMO)return;
 const {data}=await sb.storage.from("avatars").createSignedUrls(paths,3600);(data||[]).forEach(x=>{if(x.signedUrl)AV[x.path]=x.signedUrl})}
function resize(file,max=256){return new Promise((ok,ko)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);cv.toBlob(b=>b?ok(b):ko(),"image/jpeg",.85);URL.revokeObjectURL(img.src)};img.onerror=ko;img.src=URL.createObjectURL(file)})}
function pickImage(){return new Promise(r=>{const f=$("#fpick");f.value="";f.onchange=()=>r(f.files[0]||null);f.click()})}
async function uploadAvatar(name){const file=await pickImage();if(!file)return null;let blob;try{blob=await resize(file)}catch{toast("No pude leer esa imagen");return null}
 if(DEMO){const u=URL.createObjectURL(blob);AV[name]=u;return name}
 const path=name+"-"+Date.now()+".jpg";const {error}=await sb.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg",upsert:true});
 if(error){toast("No se subió: "+error.message);return null}const {data}=await sb.storage.from("avatars").createSignedUrl(path,3600);if(data)AV[path]=data.signedUrl;return path}
function initials(n){return String(n||"?").replace(/\(.*?\)/g,"").split(/\s+/).filter(w=>/^[A-Za-zÁÉÍÓÚÑáéíóúñ0-9]/.test(w)).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?"}
const AVC=["#19d3c5","#7cb4ff","#b9a2ff","#f5c451","#6ee79a","#ff8fd0"];
function avatar(c,big){const u=c.avatar_path&&AV[c.avatar_path];const col=AVC[[...String(c.business_name)].reduce((a,ch)=>a+ch.charCodeAt(0),0)%AVC.length];
 return u?`<div class="av ${big?"big":""}"><img src="${esc(u)}" alt=""></div>`:`<div class="av ${big?"big":""}" style="background:${col}">${esc(initials(c.business_name))}</div>`}
function renderMe(){const u=SET.my_avatar&&AV[SET.my_avatar];$("#me").innerHTML=u?`<img src="${esc(u)}" alt="Diego">`:`<img class="hex" src="iso.png" alt="TMB">`}

const DW=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"],dkey=d=>d.toLocaleDateString("en-CA");
function postsOn(k){return S.filter(s=>s.scheduled_at&&dkey(new Date(s.scheduled_at))==k).sort((a,b)=>a.scheduled_at.localeCompare(b.scheduled_at))}
function evs(k){return postsOn(k).map(s=>`<span class="ev2 p-${s.platform}" onclick="event.stopPropagation();openPost('${s.id}')">${({instagram:"IG",facebook:"FB",tiktok:"TT",otro:"📲"})[s.platform]||""} ${new Date(s.scheduled_at).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:false})}${s.status=="publicado"?" ✓":""}</span>`).join("")}

const PURL={instagram:"https://www.instagram.com/",facebook:"https://www.facebook.com/",tiktok:"https://www.tiktok.com/upload",otro:"https://web.whatsapp.com/"};
function duePosts(){const t=today(),lim=plusDays(7);return S.filter(s=>s.scheduled_at&&!["publicado","cancelado"].includes(s.status)&&dkey(new Date(s.scheduled_at))<=lim).sort((a,b)=>a.scheduled_at.localeCompare(b.scheduled_at))}
function postStrip(){const t=today(),L=duePosts();if(!L.length)return `<div class="empty">Nada por publicar esta semana. Planea algo en 📅 Calendario.</div>`;
 return L.map(s=>{const k=dkey(new Date(s.scheduled_at)),c=C.find(x=>x.id==s.contact_id),cl=k<t?"over":k==t?"today":"";
  return `<div class="it ${cl}" onclick="openPost('${s.id}')"><b>${k<t?"Atrasado · ":k==t?"Hoy · ":""}${PLAT[s.platform]} · ${new Date(s.scheduled_at).toLocaleString("es-MX",{weekday:"short",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})}</b><br>${s.pillar?PIL[s.pillar]:""}${c?" · "+esc(c.business_name):""} · <span class="pill s-${s.status}" style="padding:1px 7px;font-size:11px">${PST[s.status]}</span><div class="cap">${esc(s.topic||s.hook||s.caption||"Sin texto todavía")}</div></div>`}).join("")}
function fullText(s){return [s.hook,s.caption,s.cta,s.hashtags].filter(Boolean).join("\n\n")}
async function copyPost(id){const s=S.find(x=>x.id==id),t=fullText(s);if(!t)return toast("Este post no tiene texto todavía");try{await navigator.clipboard.writeText(t);toast("¡Copiado! 📋")}catch{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("¡Copiado! 📋")}}
async function donePost(id){const u=prompt("¡Bien! Pega el link del post publicado (o déjalo vacío):","");if(u===null)return;
 if(await db.up("social_posts",id,{status:"publicado",published_at:new Date().toISOString(),post_url:u.trim()||S.find(x=>x.id==id).post_url||null})){toast("Marcado como publicado ✅");render();openPost(id)}}
function renderCal(){const r=new Date(calRef),t=today();let body="",title="";
 if(calMode=="mes"){const first=new Date(r.getFullYear(),r.getMonth(),1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));title=first.toLocaleDateString("es-MX",{month:"long",year:"numeric"}).replace(/^./,x=>x.toUpperCase());
  body=`<div class="cal">${DW.map(d=>`<div class="dw">${d}</div>`).join("")}${Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const k=dkey(d);return `<div class="d ${d.getMonth()!=r.getMonth()?"out":""} ${k==t?"td":""}" onclick="newPost('${k}')"><div class="n">${d.getDate()}</div>${evs(k)}</div>`}).join("")}</div>`}
 else if(calMode=="semana"){const start=new Date(r);start.setDate(r.getDate()-((r.getDay()+6)%7));title="Semana del "+start.toLocaleDateString("es-MX",{day:"numeric",month:"short"});
  body=`<div class="cal wk">${Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return `<div class="dw">${DW[i]} ${d.getDate()}</div>`}).join("")}${Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const k=dkey(d);return `<div class="d ${k==t?"td":""}" onclick="newPost('${k}')">${evs(k)}</div>`}).join("")}</div>`}
 else{title="Todas las publicaciones";const L=[...S].sort((a,b)=>String(a.scheduled_at||"9").localeCompare(String(b.scheduled_at||"9")));
  body=`<div class="grid plist">${L.length?L.map(s=>{const c=C.find(x=>x.id==s.contact_id);return `<div class="card" onclick="openPost('${s.id}')"><div class="meta" style="margin-top:0"><span class="pill p-${s.platform}">${PLAT[s.platform]||s.platform}</span><span class="pill s-${s.status}">${PST[s.status]}</span></div><h4 style="margin-top:10px">${esc((s.caption||"Sin texto").slice(0,70))}</h4><div class="cat">${fdt(s.scheduled_at)}${s.pillar?" · "+PIL[s.pillar]:""}${c?" · "+esc(c.business_name):""}</div>${s.status=="publicado"&&s.views!=null?`<div class="pk" style="margin-top:6px">👁 ${s.views} · ❤️ ${s.likes??0} · 💬 ${s.comments??0} · 🔁 ${s.shares??0} · 🔖 ${s.saves??0}</div>`:""}</div>`}).join(""):`<div class="soon">Todavía no hay publicaciones. Toca “+ Nueva publicación”.</div>`}</div>`}
 $("#calv").innerHTML=`<div class="next" style="margin-bottom:12px"><h3>📣 Hoy toca publicar (y próximos 7 días)</h3><div class="row">${postStrip()}</div></div><div class="next" style="margin-bottom:12px"><h3>ℹ️ Así funciona</h3><div style="font-size:13px;color:var(--mut);line-height:1.5">Aquí planeas tus posts. <b style="color:var(--ink)">No se publica solo</b> en Instagram, Facebook ni TikTok: abres el post, tocas “Copiar texto”, abres el video y la app, publicas tú (o programas gratis en Meta Business Suite) y tocas “Ya lo publiqué”.</div></div>
  <div class="cal-h"><button class="ghost" onclick="calMove(-1)">‹</button><h3>${title}</h3><button class="ghost" onclick="calMove(1)">›</button></div>
  <div class="tools"><select id="calm" style="max-width:none;flex:1"><option value="mes">Mes</option><option value="semana">Semana</option><option value="lista">Lista</option></select><button onclick="newPost('${t}')">+ Nueva publicación</button></div>${body}`;
 $("#calm").value=calMode;$("#calm").onchange=e=>{calMode=e.target.value;renderCal()}}
function calMove(n){const r=new Date(calRef);if(calMode=="semana")r.setDate(r.getDate()+7*n);else r.setMonth(r.getMonth()+n,1);calRef=r;renderCal()}
function newPost(k){openPost(null,k)}
function openPost(id,day){const s=id?S.find(x=>x.id==id):{platform:"instagram",status:"idea",scheduled_at:null};const dt=s.scheduled_at?new Date(s.scheduled_at):day?new Date(day+"T10:00"):null;
 const loc=dt?new Date(dt.getTime()-dt.getTimezoneOffset()*6e4).toISOString().slice(0,16):"";
 const opt=(o,v)=>Object.keys(o).map(k=>`<option value="${k}" ${k==v?"selected":""}>${o[k]}</option>`).join("");
 $("#panel").innerHTML=`<div class="top"><h2>${id?"Publicación":"Nueva publicación"}</h2><button class="ghost" onclick="closeC()">✕</button></div>
 ${id&&s.status!="cancelado"?`<div class="sec"><h3>🚀 Listo para publicar</h3>${s.topic||s.hook?`<div class="why" style="margin-bottom:12px">${s.topic?`<b>${esc(s.topic)}</b><br>`:""}${s.hook?"Gancho: "+esc(s.hook):""}</div>`:""}<div class="pub">
  <button onclick="copyPost('${s.id}')">📋 Copiar texto</button>${s.asset_url?`<a class="btn alt" style="padding:14px 10px;text-align:center;font-size:15px" href="${esc(s.asset_url)}" target="_blank" rel="noopener">🎬 Abrir video/archivo</a>`:`<button class="alt" disabled style="opacity:.45">🎬 Sin archivo</button>`}
  <a class="btn alt full" style="padding:14px 10px;text-align:center;font-size:15px" href="${PURL[s.platform]}" target="_blank" rel="noopener">Abrir ${PLAT[s.platform]}</a>
  ${s.status=="publicado"?`<div class="full pk" style="text-align:center">✅ Publicado ${fdt(s.published_at)}</div>`:`<button class="full" onclick="donePost('${s.id}')">✅ Ya lo publiqué</button>`}</div>
  <p class="note">Copia el texto, abre el video, publícalo tú en la app y regresa a tocar “Ya lo publiqué”. Aquí no se publica nada solo.</p></div>`:""}
 <div class="sec"><div class="two"><div class="f"><label>Red</label><select id="s_pl">${opt(PLAT,s.platform)}</select></div><div class="f"><label>Estatus</label><select id="s_st">${opt(PST,s.status)}</select></div></div>
 <div class="f"><label>Fecha y hora</label><input type="datetime-local" id="s_dt" value="${loc}"></div>
 <div class="f"><label>Pilar de contenido</label><select id="s_pi"><option value="">—</option>${opt(PIL,s.pillar)}</select></div>
 <div class="f"><label>Cliente (opcional)</label><select id="s_c"><option value="">Magic Box (propio)</option>${C.filter(c=>c.type=="cliente").map(c=>`<option value="${c.id}" ${c.id==s.contact_id?"selected":""}>${esc(c.business_name)}</option>`).join("")}</select></div>
 <h3 style="margin-top:16px">¿Qué vas a publicar?</h3>
 <div class="f"><label>Idea / tema</label><input id="s_to" value="${esc(s.topic)}" placeholder="Ej. Así grabamos con dron en la Zona Hotelera"></div>
 <div class="f"><label>Gancho (primeros 3 segundos)</label><input id="s_ho" value="${esc(s.hook)}" placeholder="Ej. ¿Tu hotel se ve así desde arriba? 👀"></div>
 <div class="f"><label>Texto / caption</label><textarea id="s_ca" style="min-height:110px">${esc(s.caption)}</textarea></div>
 <div class="f"><label>Llamado a la acción (CTA)</label><input id="s_ct" value="${esc(s.cta)}" placeholder="Ej. Escríbenos por WhatsApp 👉 link en bio"></div>
 <div class="f"><label>Hashtags</label><input id="s_ht" value="${esc(s.hashtags)}" placeholder="#cancun #marketing #reels"></div>
 <div class="f"><label>Link del material (Drive, video…)</label><input id="s_as" value="${esc(s.asset_url)}" placeholder="https://drive.google.com/…"></div>
 ${s.asset_url||s.post_url?`<div class="ql" style="margin:0 0 10px">${s.asset_url?`<a href="${esc(s.asset_url)}" target="_blank" rel="noopener">Abrir material</a>`:""}${s.post_url?`<a href="${esc(s.post_url)}" target="_blank" rel="noopener">Ver post</a>`:""}</div>`:""}
 <h3 style="margin-top:16px">Después de publicar</h3><div class="f"><label>Link del post publicado</label><input id="s_pu" value="${esc(s.post_url)}" placeholder="https://instagram.com/p/…"></div>
 <div class="f"><label>Números (vistas · likes · comentarios · compartidos · guardados)</label><div class="mx">${["views","likes","comments","shares","saves"].map((k,i)=>`<input type="number" id="s_${k}" value="${s[k]??""}" placeholder="${["👁","❤️","💬","🔁","🔖"][i]}">`).join("")}</div></div>
 <div class="acts"><button id="s_ok">💾 Guardar</button>${id?`<button class="ghost" id="s_del">Borrar</button>`:""}</div><p class="note">Recordatorio: guardar aquí no publica nada en tus redes.</p></div>`;
 $("#drawer").classList.add("on");
 $("#s_ok").onclick=async()=>{const n=k=>{const v=$("#s_"+k).value;return v===""?null:Number(v)};const v=$("#s_dt").value;
  const row={platform:$("#s_pl").value,status:$("#s_st").value,scheduled_at:v?new Date(v).toISOString():null,pillar:$("#s_pi").value||null,contact_id:$("#s_c").value||null,caption:$("#s_ca").value.trim()||null,topic:$("#s_to").value.trim()||null,hook:$("#s_ho").value.trim()||null,cta:$("#s_ct").value.trim()||null,hashtags:$("#s_ht").value.trim()||null,asset_url:$("#s_as").value.trim()||null,post_url:$("#s_pu").value.trim()||null,views:n("views"),likes:n("likes"),comments:n("comments"),shares:n("shares"),saves:n("saves")};
  const ok=id?await db.up("social_posts",id,row):await db.ins("social_posts",row);if(ok){toast("Guardado ✅");closeC();render()}};
 if(id)$("#s_del").onclick=async()=>{if(confirm("¿Borrar esta publicación?")&&await db.del("social_posts",id)){toast("Borrada");closeC();render()}};
}
if("serviceWorker" in navigator){} // sin service worker: la app siempre carga lo último
boot();
</script>
</body></html>
