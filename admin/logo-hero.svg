<svg viewBox="0 0 100 115" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="hexGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="hexGlowHover" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>
      <!-- Glow border layer -->
      <polygon id="hexBorderGlow" points="50,2 98,27 98,88 50,113 2,88 2,27"
        fill="none"
        stroke="rgba(255,255,255,0.25)"
        stroke-width="3"
        filter="url(#hexGlow)"
        style="transition: stroke 0.3s, stroke-width 0.3s"/>
      <!-- Main hex fill: black -->
      <polygon points="50,2 98,27 98,88 50,113 2,88 2,27"
        fill="#000000"
        stroke="rgba(255,255,255,0.9)"
        stroke-width="1.5"/>
      <!-- TMB text: black -->
      <text x="66" y="82" text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="28" fill="#ffffff" letter-spacing="2" font-weight="400">TMB</text>
    </svg>