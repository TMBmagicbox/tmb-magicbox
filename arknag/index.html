<script>
(function(){
var TRACKS=[
  {title:'Frío',now:'Arkna G — Frío',cover:'vinilo-frio.jpg',kind:'spotify'},
  {title:'Let Me Work It',now:'Arkna G — Let Me Work It',cover:'vinilo-rostro.jpg',kind:'local'}
];
var a=document.getElementById('track'),h=document.querySelector('.hero'),v=document.getElementById('vinyl'),
p=document.getElementById('pp'),g=document.getElementById('prog'),vimg=document.getElementById('vimg'),
ptt=document.getElementById('ptt'),nowt=document.getElementById('nowt'),
items=[].slice.call(document.querySelectorAll('#tracks li'));
var idx=0,ctrl=null,heard=false,chained=false,nearEnd=false,busy=false;

function shouldChain(ev,st){
  if(!ev||st.idx!==0||st.chained||!st.heard)return{chain:false,nearEnd:st.nearEnd};
  var dur=ev.duration||0,pos=ev.position||0,near=st.nearEnd;
  if(dur>0&&pos>=dur-500){
    near=true;
    if(ev.isPaused||pos>=dur-80)return{chain:true,nearEnd:near};
  }
  if(near&&ev.isPaused&&pos<1000)return{chain:true,nearEnd:near};
  return{chain:false,nearEnd:near};
}
window.__arknaShouldChain=shouldChain;

function setProg(n){g.style.width=(Math.max(0,Math.min(100,n||0)))+'%'}

function applyTrack(i){
  idx=i;
  var t=TRACKS[i];
  vimg.src=t.cover;vimg.alt=t.now;
  ptt.textContent=t.title;nowt.textContent=t.now;
  v.setAttribute('aria-label','Reproducir o pausar '+t.title);
  items.forEach(function(el,j){el.classList.toggle('on',j===i)});
  if(i===0){chained=false;nearEnd=false;heard=false}
}

function pauseLocal(){try{a.pause();a.currentTime=0}catch(e){}}
function pauseSpotify(){if(ctrl){try{ctrl.pause()}catch(e){}}}
function playLocal(){
  var pr=a.play();
  if(pr&&pr.catch)pr.catch(function(){h.classList.remove('playing')});
}

function selectTrack(i,autoplay){
  if(i===idx&&!autoplay)return;
  busy=true;
  pauseLocal();pauseSpotify();
  h.classList.remove('playing');setProg(0);
  applyTrack(i);
  if(autoplay){
    if(i===1)playLocal();
    else if(ctrl){try{ctrl.restart?ctrl.restart():ctrl.play()}catch(e){try{ctrl.play()}catch(e2){}}}
  }
  setTimeout(function(){busy=false},400);
}

function chainToNext(){
  if(chained)return;
  chained=true;nearEnd=false;
  pauseSpotify();
  selectTrack(1,true);
}

function onSpotifyUpdate(e){
  var ev=e&&e.data;if(!ev||busy||idx!==0)return;
  if(!ev.isPaused&&ev.position>1000)heard=true;
  if(!ev.isPaused)h.classList.add('playing');
  else if(!chained)h.classList.remove('playing');
  if(ev.duration>0)setProg(ev.position/ev.duration*100);
  var r=shouldChain(ev,{idx:idx,heard:heard,chained:chained,nearEnd:nearEnd});
  nearEnd=r.nearEnd;
  if(r.chain)chainToNext();
}

function toggle(){
  if(idx===0){
    if(!ctrl)return;
    try{ctrl.togglePlay()}catch(e){}
  }else{
    if(a.paused)playLocal();else a.pause();
  }
}

items.forEach(function(el){
  el.addEventListener('click',function(){
    var i=+el.getAttribute('data-i');
    if(i===idx)toggle();else selectTrack(i,true);
  });
});
[v,p].forEach(function(el){el.addEventListener('click',toggle)});
a.addEventListener('play',function(){if(idx===1)h.classList.add('playing')});
a.addEventListener('pause',function(){if(idx===1)h.classList.remove('playing')});
a.addEventListener('ended',function(){a.currentTime=0;h.classList.remove('playing');setProg(0)});
a.addEventListener('timeupdate',function(){if(idx===1&&a.duration)setProg(a.currentTime/a.duration*100)});
a.addEventListener('contextmenu',function(e){e.preventDefault()});

function initSpotify(api){
  var el=document.getElementById('embed-iframe');
  if(!el||!api)return;
  api.createController(el,{
    uri:'spotify:track:2D78Bf7CvawHVWNZYga3Jh',
    url:'https://open.spotify.com/embed/track/2D78Bf7CvawHVWNZYga3Jh?theme=0',
    height:152
  },function(c){
    ctrl=c;window.__arknaSpotify=c;
    c.addListener('ready',function(){});
    c.addListener('playback_started',function(){if(idx===0){heard=true;h.classList.add('playing')}});
    c.addListener('playback_update',onSpotifyUpdate);
  });
}
window.__arkna={shouldChain:shouldChain,feed:onSpotifyUpdate,select:selectTrack,state:function(){return{idx:idx,heard:heard,chained:chained,nearEnd:nearEnd,hasCtrl:!!ctrl}}};
if(window.__spotifyApi)initSpotify(window.__spotifyApi);
else window.__onSpotifyReady=initSpotify;
})();
</script>
